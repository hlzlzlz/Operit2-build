name: Windows Release Build

on:
  workflow_dispatch:
    inputs:
      products:
        description: "Release products to build"
        required: false
        default: "all"
        type: choice
        options:
          - "app"
          - "cli"
          - "all"
      cli_arches:
        description: "Windows CLI architectures"
        required: false
        default: "all"
        type: choice
        options:
          - "host"
          - "all"
          - "x86_64"
          - "aarch64"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2025
    # The App build alone takes ~76 minutes on a cold cache (Rust bridge,
    # USearch WASM, Flutter release assembly), so a 90-minute ceiling expires
    # right after it and cancels the CLI and artifact-upload steps.
    timeout-minutes: 180
    env:
      RUSTFLAGS: -Awarnings
      RUST_TOOLCHAIN_VERSION: 1.95.0
      FVM_VERSION: 4.3.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bootstrap Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.5

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install FVM
        shell: pwsh
        run: |
          dart pub global activate fvm $env:FVM_VERSION
          "$env:APPDATA\Pub\Cache\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # The Flutter build hook and the Gradle/MSBuild plugin-sync hook regenerate
      # ToolPkg assets through plugins/tools/sync_plugin_packages.py. That script
      # needs the repository-managed TypeScript compiler and Corepack/pnpm, and
      # tooling resolves the interpreter at <repo>/.venv/Scripts/python.exe.
      - name: Prepare build-hook toolchain
        shell: pwsh
        run: |
          python -m venv .venv
          npm install --prefix .ci-tools/typescript --no-audit --no-fund typescript@5.9.3
          corepack enable pnpm
          corepack pnpm --version

      - name: Install built-in workflow plugin dependencies
        working-directory: plugins/packages/buildin/workflow
        shell: pwsh
        run: corepack pnpm install --frozen-lockfile

      - name: Install project Flutter SDK
        working-directory: apps/flutter/app
        shell: pwsh
        run: fvm install --skip-pub-get

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN_VERSION }}
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Install LLVM
        shell: pwsh
        run: choco install llvm --no-progress --limit-output --yes

      - name: Install .NET SDK for MSI packaging
        if: inputs.products != 'cli'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # The built-in character_cards plugin bundles a USearch WebAssembly module
      # generated at build time (resources/usearch.wasm is gitignored).
      # vendor/usearch/build.py compiles it with Emscripten and fails with
      # "USearch requires Emscripten: install .ci-tools/emsdk or set EMXX" when
      # the pinned SDK is absent.
      - name: Install Emscripten SDK
        if: inputs.products != 'cli'
        shell: pwsh
        run: |
          $emsdkVersion = "3.1.61"
          $target = ".ci-tools/emsdk"
          if (-not (Test-Path "$target/upstream/emscripten/em++.py")) {
            New-Item -ItemType Directory -Force -Path $target | Out-Null
            git clone --depth 1 --branch $emsdkVersion https://github.com/emscripten-core/emsdk.git $target
            Push-Location $target
            try {
              ./emsdk install $emsdkVersion
              ./emsdk activate $emsdkVersion
            } finally {
              Pop-Location
            }
          }
          if (-not (Test-Path "$target/upstream/emscripten/em++.py")) {
            throw "Emscripten was not provisioned at $target"
          }
          Write-Host "Emscripten ready at $target"

      - name: Check build environment
        shell: pwsh
        run: python tools/build_scripts/check_build_environment.py --products "${{ inputs.products }}" --cli-arches "${{ inputs.cli_arches }}" --github-runner

      # MSBuild reports the Rust bridge failure only as MSB8066 ("Custom build
      # ... exited with code 1") and discards Cargo's diagnostics, which makes the
      # real cause invisible. Build the same crate the CMake step builds, so a
      # Cargo error surfaces with its full message before the Flutter build starts.
      #
      # This must not call `cargo` directly. operit-runtime's build.rs validates
      # two gitignored, generated inputs before release compilation:
      #   1. assets/models_dev/catalog.json.gz  -> models_dev_bundle.prepare_build_catalog()
      #   2. assets/plugins/{buildin,external}  -> plugins/tools/sync_plugin_packages.py
      # and panics on release builds when either is missing. CMake orders
      # sync_operit_plugins before the bridge, and common.run() calls
      # prepare_build_catalog before Cargo; do the same here.
      - name: Preflight Rust bridge build
        if: inputs.products != 'cli'
        shell: pwsh
        continue-on-error: true
        run: |
          Write-Host "=== sync plugin packages (what CMake's sync_operit_plugins does) ==="
          python plugins/tools/sync_plugin_packages.py --source runtime --no-hot-reload 2>&1 | Select-Object -Last 30
          Write-Host "=== sync exit code: $LASTEXITCODE ==="

          $crate = "apps/flutter/native/operit-flutter-bridge"
          Write-Host "=== cargo build via cargo_build.py (same path as the CMake bridge step) ==="
          $cargo = (Get-Command cargo).Source
          python tools/build_scripts/cargo_build.py $cargo build --manifest-path "$crate/Cargo.toml" --release 2>&1 | Tee-Object -Variable cargoLog
          $code = $LASTEXITCODE
          Write-Host "=== cargo exit code: $code ==="
          if ($code -ne 0) {
            Write-Host "--- error lines ---"
            $cargoLog | Select-String -Pattern "error(\[E\d+\])?:|panicked at|Caused by:|models\.dev|do not match|missing assets|stale assets" | Select-Object -First 20 | ForEach-Object { $_.Line }
            Write-Host "--- rustc/cargo versions ---"
            cargo --version
            rustc --version
          }

      - name: Build and package Windows app
        if: inputs.products != 'cli'
        shell: pwsh
        run: python tools/build_scripts/build_flutter_windows.py --enforce-lockfile

      - name: Build and package Windows CLI
        if: inputs.products != 'app'
        shell: pwsh
        run: python tools/build_scripts/build_cli_windows.py --arches "${{ inputs.cli_arches }}"

      - name: Verify Windows installer and update helpers
        if: inputs.products != 'cli'
        shell: pwsh
        run: |
          python -m unittest discover -s tools/tests -p test_windows_msi.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tools/tests -p test_windows_application_update.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installers = @(Get-ChildItem -LiteralPath tools/release/dist -Filter 'operit2-app-windows-x86_64-*.msi')
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows MSI artifact.' }
          $installerPath = $installers[0].FullName
          dotnet run --project tools/windows-installer/tests/CleanupTests.csproj -c Release --no-launch-profile -p:RestoreLockedMode=true -- $installerPath

      - name: Upload Windows app artifact
        if: inputs.products != 'cli'
        uses: actions/upload-artifact@v4
        with:
          name: operit2-windows-app-${{ github.sha }}
          path: tools/release/dist/operit2-app-windows-x86_64-*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows CLI artifacts
        if: inputs.products != 'app'
        uses: actions/upload-artifact@v4
        with:
          name: operit2-windows-cli-${{ github.sha }}
          path: tools/release/dist/operit2-cli-windows-*.zip
          if-no-files-found: error
          retention-days: 14
